# Самодействие прогона доработки (E0, аудит 2026-10-29).
# Одобрений человеком нет (решения владельца 17.10 и 29.10): вместо гейта одобрения
# патч проверяется своим же smoke ДО commit/push/рестарта. Грязное дерево = боевой
# процесс собран не из git, поэтому патч отклоняется, а не применяется без коммита.
# Мобильный доступ (образец Hermes Mobile). Профили, токены, mTLS и PIN живут
# в БД и правятся в окне (раздел «Мобильный доступ»), здесь — только рамки.
# Порт SSH-туннеля НЕ настраивается тут: он всегда равен server.port выше,
# иначе телефон стучался бы не в тот порт.
mobile:
  enabled: true             # показывать раздел «Мобильный доступ»
  loopback_host: 127.0.0.1  # адрес, который открывает телефон через туннель
  session_ttl_hours: 12     # срок жизни мобильной сессии (0 = до «завершить все»)
  default_expires_days: 30  # срок действия нового профиля (0 = бессрочно)
  cert_days: 30             # срок клиентского сертификата mTLS


devrun:
  auto_apply: true        # патч успешного прогона применяется сам
  auto_restart: true      # сервис перезапускается на новом коде
  smoke_gate: true        # scripts/smoke.py обязан пройти до commit/push (~70 с)
  smoke_timeout: 300      # сек на прогон smoke
  allow_dirty: false      # не применять патч в дерево с незакоммиченными правками
  # серверный исполнитель прогонов (server/devexec.py, 2026-10-31): прогон
  # исполняет сам сервис в worktree СВОЕГО репозитория, патч проходит smoke до
  # commit/push. Оболочка ноутбука для этого больше не нужна.
  execute: true           # цикл исполнителя включён
  poll_seconds: 5         # как часто смотреть очередь queued-прогонов
  worktree_root: ~/workspace/noosphere-dev   # внутри джейла записи инструментов
  exec_class: code        # класс задачи хода исполнителя → тир модели
  exec_max_iters: 60      # потолок раундов инструментов
  exec_budget: 0          # 0 → tools.turn_max_tokens
  max_wall_minutes: 20    # стена на прогон
  patch_max_chars: 400000 # потолок размера патча
